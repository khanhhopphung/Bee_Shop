  <!-- CSS Files -->

  <link rel="stylesheet" type="text/css" href="%PUBLIC_URL%/fonts/iconic/css/material-design-iconic-font.min.css">
  <link rel="stylesheet" type="text/css" href="%PUBLIC_URL%/fonts/linearicons-v1.0.0/icon-font.min.css">

  <link rel="stylesheet" type="text/css" href="%PUBLIC_URL%/vendor/css-hamburgers/hamburgers.min.css">
  <link rel="stylesheet" type="text/css" href="%PUBLIC_URL%/vendor/animsition/css/animsition.min.css">

  <link rel="stylesheet" type="text/css" href="%PUBLIC_URL%/vendor/daterangepicker/daterangepicker.css">
  <link rel="stylesheet" type="text/css" href="%PUBLIC_URL%/vendor/slick/slick.css">
  <link rel="stylesheet" type="text/css" href="%PUBLIC_URL%/vendor/MagnificPopup/magnific-popup.css">

</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- jQuery -->
  <script src="%PUBLIC_URL%/vendor/jquery/jquery-3.2.1.min.js"></script>

  <!-- Other JS Libraries -->

  <script src="%PUBLIC_URL%/vendor/animsition/js/animsition.min.js"></script>
  <script src="%PUBLIC_URL%/vendor/bootstrap/js/popper.js"></script>
  <script src="%PUBLIC_URL%/vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="%PUBLIC_URL%/vendor/select2/select2.min.js"></script>
  <script src="%PUBLIC_URL%/vendor/daterangepicker/moment.min.js"></script>
  <script src="%PUBLIC_URL%/vendor/daterangepicker/daterangepicker.js"></script>
  <script src="%PUBLIC_URL%/vendor/slick/slick.min.js"></script>
  <script src="%PUBLIC_URL%/vendor/parallax100/parallax100.js"></script>
  <script src="%PUBLIC_URL%/vendor/MagnificPopup/jquery.magnific-popup.min.js"></script>
  <script src="%PUBLIC_URL%/vendor/isotope/isotope.pkgd.min.js"></script>
  <script src="%PUBLIC_URL%/vendor/sweetalert/sweetalert.min.js"></script>
  <script src="%PUBLIC_URL%/vendor/perfect-scrollbar/perfect-scrollbar.min.js"></script>

  <!-- Custom Scripts -->
  <script>
    $(document).ready(function () {
      // Khởi tạo Select2
      console.log(typeof jQuery);
      $(".js-select2").each(function () {
        $(this).select2({
          minimumResultsForSearch: 20,
          dropdownParent: $(this).next('.dropDownSelect2')
        });
      });

      // Khởi tạo Parallax
      $('.parallax100').parallax100();



      // Khởi tạo Magnific Popup
      $('.gallery-lb').each(function () {
        $(this).magnificPopup({
          delegate: 'a',
          type: 'image',
          gallery: {
            enabled: true
          },
          mainClass: 'mfp-fade'
        });
      });

      // SweetAlert cho wishlist và cart
      $('.js-addwish-b2').each(function () {
        var nameProduct = $(this).parent().parent().find('.js-name-b2').html();
        $(this).on('click', function (e) {
          e.preventDefault();
          swal(nameProduct, "is added to wishlist !", "success");
          $(this).addClass('js-addedwish-b2').off('click');
        });
      });

      $('.js-addcart-detail').each(function () {
        var nameProduct = $(this).parent().parent().parent().parent().find('.js-name-detail').html();
        $(this).on('click', function () {
          swal(nameProduct, "is added to cart !", "success");
        });
      });

      // Khởi tạo Perfect Scrollbar
      $('.js-pscroll').each(function () {
        $(this).css('position', 'relative').css('overflow', 'hidden');
        var ps = new PerfectScrollbar(this, {
          wheelSpeed: 1,
          scrollingThreshold: 1000,
          wheelPropagation: false,
        });

        $(window).on('resize', function () {
          ps.update();
        });
      });
    });
  </script>

  <!-- Custom JS -->
  <script src="%PUBLIC_URL%/js/slick-custom.js"></script>
  <script src="%PUBLIC_URL%/js/main.js"></script>
</body>

</html>
